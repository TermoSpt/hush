<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hush</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- ============ sidebar ============ -->
  <aside id="sidebar">
    <div class="brand"><span class="logo"></span>hush</div>
    <button id="mode-badge" class="mode-badge" type="button"></button>
    <button id="new-chat" class="btn primary wide" type="button">New chat <kbd>Ctrl N</kbd></button>
    <div id="chat-list" class="chat-list"></div>
    <nav class="side-nav">
      <button class="nav-btn" data-open="setup" type="button">Setup check</button>
      <button class="nav-btn" data-open="models" type="button">Models</button>
      <button class="nav-btn" data-open="bench" type="button">Test models</button>
      <button class="nav-btn" data-open="privacy" type="button">Privacy &amp; data</button>
      <button class="nav-btn" data-open="guide" type="button">How tuning works</button>
      <button id="wipe-btn" class="nav-btn danger" type="button" title="Ctrl+Shift+L">Wipe session</button>
    </nav>
    <div id="hw" class="hw" title="Your graphics card, live"></div>
    <div id="conn" class="conn"></div>
  </aside>

  <!-- ============ main ============ -->
  <main id="main">
    <header id="topbar">
      <div class="model-pick">
        <select id="model-select" aria-label="Model"></select>
        <div id="caps" class="caps"></div>
      </div>
      <button id="mem-gauge" class="mem-gauge" type="button" title="GPU memory: click to tune"></button>
      <button id="tune-toggle" class="btn ghost" type="button">Tune</button>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <footer id="composer">
      <div id="ctx-bar" class="ctx-bar"></div>
      <div id="attach-pop" class="attach-pop" hidden></div>
      <div id="attachments" class="attachments"></div>
      <div class="input-row">
        <button id="attach-btn" class="icon-btn" type="button" title="Attach files: see what's supported"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <input id="file-input" type="file" multiple hidden>
        <textarea id="input" rows="1" placeholder="Message…  (Shift+Enter for a new line · paste or drop files)"></textarea>
        <button id="send-btn" class="btn primary" type="button">Send</button>
      </div>
    </footer>
  </main>

  <!-- ============ tune panel ============ -->
  <aside id="tune" class="tune" hidden>
    <div class="tune-head">
      <h2>Tune this chat</h2>
      <button id="tune-close" class="icon-btn" type="button" aria-label="Close">×</button>
    </div>
    <div id="tune-body" class="tune-body"></div>
  </aside>
</div>

<!-- ============ overlays ============ -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <button id="sheet-close" class="icon-btn sheet-x" type="button" aria-label="Close">×</button>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="gate" class="gate" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
<div id="drop" class="drop" hidden><div>Drop files to attach<small>Images (for vision models) · PDF · Word · Excel · PowerPoint · text, data and code files</small></div></div>
<div id="toasts" class="toasts"></div>

<script src="markdown.js"></script>
<script src="estimate.js"></script>
<script src="backend.js"></script>
<script src="office.js"></script>
<script src="roles.js"></script>
<script src="app.js"></script>
<script src="bench.js"></script>
<script src="setup.js"></script>
</body>
</html>
